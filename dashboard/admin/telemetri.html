<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Telemetri & KPI — Admin Radar MBG</title>
  <link rel="icon" type="image/webp" href="../../assets/images/ic_launcher.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#001026',
            'primary-container': '#0b2545',
            secondary: '#395f95',
            'tertiary-fixed': '#6ffbbe',
            surface: '#f8f9ff',
            'surface-card': '#ffffff',
            'status-success': '#059669',
            'status-warning': '#f59e0b',
            'status-error': '#ef4444'
          },
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../../assets/css/style.css"/>
  <link rel="stylesheet" href="../../assets/css/dashboard.css"/>
  <link rel="stylesheet" href="../../assets/css/admin.css"/>
  <link rel="stylesheet" href="../../assets/css/security.css"/>
  <link rel="stylesheet" href="../../assets/css/site-footer.css"/>
  <script src="../../assets/js/admin-auth.js"></script>
  <script src="../../assets/js/internal-chat-presence.js" defer></script>
  <script src="../../assets/js/admin-header.js" defer></script>
</head>
<body data-admin-page="telemetri" class="bg-surface font-sans text-primary min-h-screen flex flex-col justify-between">

  <div data-admin-header></div>

  <main class="max-w-7xl mx-auto w-full p-4 sm:p-8 flex-grow">
    <div id="dashProfileCard" class="mb-4"></div>

    <nav class="page-breadcrumb" aria-label="Breadcrumb">
      <a href="../../index.html">Beranda</a><span class="sep">/</span>
      <a href="index.html">Dashboard Admin</a><span class="sep">/</span>
      <span class="current">Telemetri &amp; KPI</span>
    </nav>

    <!-- Manajemen Telemetri Nasional (5 KPI Utama) -->
    <div id="telemetry-manager" class="bg-surface-card rounded-3xl border border-slate-200/80 shadow-sm p-6 sm:p-8 mb-8">
      <div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100">
        <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center">
          <span class="material-symbols-outlined text-2xl">monitoring</span>
        </div>
        <div>
          <h1 class="text-lg font-bold text-primary">Manajemen Telemetri Nasional (5 KPI Utama)</h1>
          <p class="text-xs text-slate-500">Nilai yang diubah di sini langsung terhubung ke database dan tampil secara dinamis pada halaman utama.</p>
        </div>
      </div>

      <form action="#" method="POST" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <input type="hidden" name="action" value="update_telemetri">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Porsi Tersalurkan</label>
          <input type="number" name="porsi_tersalurkan" value="4850210" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Pencapaian Target (%)</label>
          <input type="number" step="0.1" name="persen_target" value="99.2" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">SPPG Aktif Beroperasi</label>
          <input type="number" name="sppg_aktif" value="1284" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Sekolah Terlayani</label>
          <input type="number" name="sekolah_terlayani" value="18420" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Kepatuhan AKG (%)</label>
          <input type="number" step="0.1" name="kepatuhan_akg" value="99.6" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Rantai Hangat (°C)</label>
          <input type="number" step="0.1" name="suhu_rata_rata" value="65.8" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">SLA Distribusi Pagi (%)</label>
          <input type="number" step="0.1" name="sla_distribusi" value="99.8" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Teks Waktu Pembaruan</label>
          <input type="text" name="pembaruan_teks" value="Hari ini, Pukul 11.45 WIB" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold">
        </div>
        <div class="col-span-full pt-2">
          <button type="submit" class="px-5 py-2.5 rounded-xl bg-primary hover:bg-primary-container text-white font-bold text-xs flex items-center gap-2 shadow-sm transition-all">
            <span class="material-symbols-outlined text-sm">save</span>
            <span>Simpan Perubahan Telemetri ke Database</span>
          </button>
        </div>
      </form>
    </div>
  </main>

  <div data-site-footer></div>

  <script src="../../assets/js/site-footer.js" defer></script>
  <script src="../../assets/js/security.js"></script>
  <script src="../../assets/js/dashboard-common.js?v=admin-dashboard-ui-2"></script>

  <!--
    ════════════════════════════════════════════════════════════════════
    dashboard/admin/telemetri.html — INPUT TELEMETRI NASIONAL & KPI
    Isi: form update_telemetri (porsi, target %, SPPG, sekolah, AKG,
      suhu rantai dingin, SLA distribusi, teks pembaruan).
    Catatan: form masih demo (action="#") — submit ditahan admin-auth.js
      dan menampilkan toast "belum terhubung ke server".
    Dependensi: admin-auth.js, admin-header.js, dashboard-common.js,
      security.js.
    Endpoint terkait: api/telemetri.php (update_telemetri),
      api/home_menu.php (data KPI publik).
    ════════════════════════════════════════════════════════════════════
  -->
</body>
</html>
