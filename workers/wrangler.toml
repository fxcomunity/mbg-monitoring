name = "mbg-monitoring-api"
main = "auth.js"
compatibility_date = "2024-09-23"

# ─── Cron Trigger: arsip menu kemarin setiap hari jam 00:05 WIB (17:05 UTC) ──
[triggers]
crons = ["5 17 * * *"]

# ─── Durable Objects (WebSocket realtime map) ──────────────────────────────
[durable_objects]
bindings = [
  { name = "MAP_ROOM", class_name = "MapRoom", script_name = "mbg-monitoring-api" }
]

[[migrations]]
tag = "v1"
new_classes = ["MapRoom"]

# ─── KV Namespaces ─────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "USERS"
id = "GANTI_DENGAN_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "SESSIONS"
id = "GANTI_DENGAN_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "DATA"
id = "GANTI_DENGAN_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "RATE"
id = "GANTI_DENGAN_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "THREATS"
id = "GANTI_DENGAN_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "BLOCKED_IPS"
id = "GANTI_DENGAN_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "MENU_CACHE"
id = "GANTI_DENGAN_KV_NAMESPACE_ID"      # buat via: wrangler kv:namespace create MENU_CACHE

# ─── Environment Variables ──────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"

# DATABASE_URL disimpan sebagai secret (tidak di-commit ke git):
#   wrangler secret put DATABASE_URL
# format: postgresql://user:password@ep-xxx.neon.tech/neondb?sslmode=require
