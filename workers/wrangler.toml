name = "mbg-monitoring-api"
main = "auth.js"
compatibility_date = "2024-09-23"

# ─── Cron Trigger ──────────────────────────────────────────────────────────
[triggers]
crons = ["5 17 * * *"]

# ─── KV Namespaces ─────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "USERS"
id = "493f24dc223d4a9ea0ba62ec7d2b4fb9"

[[kv_namespaces]]
binding = "SESSIONS"
id = "2e12b6cbb1e64ab0a7d03ba739ada7de"

[[kv_namespaces]]
binding = "DATA"
id = "85539fc16a9b49558ef198e7fab116d4"

[[kv_namespaces]]
binding = "RATE"
id = "b899bc3c00dd46e1bdfc0cb1803e485a"

[[kv_namespaces]]
binding = "THREATS"
id = "4c3477648cc84d7897f3182f3df3f282"

[[kv_namespaces]]
binding = "BLOCKED_IPS"
id = "ce7d7844b5a749b5a1eac646d7614ece"

[[kv_namespaces]]
binding = "MENU_CACHE"
id = "446e89c787a64c2c868e3a54c2025de8"

# ─── Environment Variables ──────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"

# DATABASE_URL di-set via: wrangler secret put DATABASE_URL
